# ─────────── 일하는 원칙 4개 ───────────
working_principles:
  - title: "신뢰는 숫자로 입증되어 다음 사업의 근거가 된다"
    description: |-
      평택시 3개년 연속 수주, KERIS 만족도 4.4 → 4.67 누적, 동일 발주처 KPF 2년 연속 수주 등 신뢰가 다음 사업으로 이어지는 사이클을 일관되게 만들어 왔습니다.
  - title: "공공 사업의 본질은 다자 거버넌스 설계"
    description: |-
      발주처(정부·교육청)의 정책 목표, 협력기관(대학·민간기업)의 전문성, 자사 팀의 실행 역량이 한 방향으로 정렬될 때 사업이 굴러갑니다. 6자 컨소시엄 R&R 설계 같은 작업이 결정적 순간을 만듭니다.
  - title: "사업의 결과는 다음 사업의 자산이 되어야 한다"
    description: |-
      사전·사후 진단평가, 만족도 조사, FGI 결과를 분석한 보고서를 다음 해 사업 설계에 직접 반영하는 환류 사이클을 운영해 왔습니다.
  - title: "글로벌 표준과 국내 현장의 가교 역할"
    description: |-
      글로벌 AI 코스웨어를 국내 대학 학사 환경과 예산 구조에 맞게 재구성하거나, 국제표준에 부합하는 AI 리터러시 모델을 국내 교사연수 구조에 맞춰 적용하는 작업을 반복해 왔습니다.
